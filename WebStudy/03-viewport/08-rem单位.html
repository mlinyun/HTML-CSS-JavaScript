<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem单位</title>
    <style>
        html {
            font-size: 14px;
        }

        div {
            font-size: 12px;
        }

        .one {
            /* em是相对与父元素字体大小的，其父元素字体大小为12px
                所以，2em转换为px即为 12px * 10 = 120px */
            width: 10em;
            height: 10em;
            background-color: pink;
        }


        .two {
            /* 不同的是rem是相对于html元素的字体大小的 */
            margin-top: 100px;
            width: 10rem;
            height: 10rem;
            background-color: hotpink;
            /* rem的优点在于可以以通过修改html里面的文字大小来改变页面中元素的大小，实现整体控制的效果 */
        }
    </style>
</head>
<body>
    <div>
        <p class="one"></p>
        <p class="two"></p>
    </div>
</body>
</html>
