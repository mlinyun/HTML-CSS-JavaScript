<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D转换-translate位移</title>
<style>
    .father {
        width: 600px;
        height: 300px;
        margin: 100px auto;
        border: 1px solid #000;
    }

    .son {
        width: 200px;
        height: 100px;
        background-color: pink;
        transition: all 0.3s;
    }

    .father:hover .son {
        transform: translate(100px, 100px);
    }
</style>
</head>
<body>
    <div class="father">
        <div class="son"></div>
    </div>
</body>
</html>
