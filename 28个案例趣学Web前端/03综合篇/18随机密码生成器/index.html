<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="box">
        <h2>随机密码生成器</h2>
        <input type="text" name="" placeholder="生成密码" id="password" readonly="readonly">
        <table>
            <th><div id="button" class="btn1" onclick="genPassword()">生成</div></th>
            <th><div id="button" class="btn2" onclick="copyPassword()">复制</div></th>
        </table>
    </div>
    <script src="./js/index.js"></script>
</body>
</html>
