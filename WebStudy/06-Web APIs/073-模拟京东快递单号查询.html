<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟京东快递单号查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .search {
            position: relative;
            width: 178px;
            margin: 100px auto 0;
        }

        .con {
            display: none;
            position: absolute;
            top: -40px;
            width: 171px;
            border: 1px solid rgba(0, 0, 0, .2);
            box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
            padding: 5px 0;
            font-size: 18px;
            line-height: 20px;
            color: #333;
        }

        /* 小三角形 */
        .con::before {
            content: '';
            width: 0;
            height: 0;
            position: absolute;
            top: 28px;
            left: 18px;
            border: 8px solid #000;
            border-style: solid dashed dashed;
            border-color: #fff transparent transparent;
        }
    </style>
</head>
<body>
    <div class="search">
        <div class="con"></div>
        <input type="text" placeholder="请您输入快递单号" class="jd">
    </div>
    <script>
        // 获取要操作的元素
        let con =document.querySelector('.con')
        let jd_input = document.querySelector('.jd')
        // 给输入框注册keyup事件
        jd_input.addEventListener('keyup', function() {
            // console.log('输入内容了');
            // 判断输入框内容是否为空
            if (this.value === '') {
                // 若为空，隐藏放大的盒子
                con.style.display = 'none'
            } else {
                // 不为空，显示放大的盒子，设置盒子的内容
                con.style.display = 'block'
                con.innerHTML = this.value
            }
        })

        // 给输入框注册失去焦点事件，隐藏放大的提示盒子
        jd_input.addEventListener('blur', function() {
            con.style.display = 'none'
        })

        // 给输入框注册获得焦点事件
        jd_input.addEventListener('focus', function() {
            // 判断输入框的内容是否为空
            if (this.value !== '') {
                // 不为空则提示盒子
                con.style.display = 'block'
            }
        })
    </script>
</body>
</html>
