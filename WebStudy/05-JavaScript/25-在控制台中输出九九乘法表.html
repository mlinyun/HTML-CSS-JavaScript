<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台输出九九乘法表</title>
</head>
<body>
    <script>
        let i = 1
        let str = ''
        while (i <= 9) {
            let j = 1
            while (j <= i) {
                str += `${j} × ${i} = ${j * i}\t`
                j++
            }
            str += '\n'
            i++
        }
        console.log(str)
    </script>
</body>
</html>
