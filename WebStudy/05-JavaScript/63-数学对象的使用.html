<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学对象的使用</title>
</head>
<body>
    <script>
        // 圆周率
        console.log(Math.PI);                   // 3.141592653589793


        // 三个取整的方法
        // （1）向下取整	往临近最小的整数取值
        console.log(Math.floor(1.1))	// 1
        console.log(Math.floor(1.9))	// 1
        // （2）向上取整	往临近最大的整数取值
        console.log(Math.ceil(0.1))	// 1
        console.log(Math.ceil(0.9))	// 1
        // （3）四舍五入	就近取整 其他数字都是四舍五入，但是 .5 是往大的取，即在数轴上向右反方向取值
        console.log(Math.round(1.1))    // 1
        console.log(Math.round(1.5))	// 2
        console.log(Math.round(-1.5))	// -1
        console.log(Math.round(-3.5))	// -3
        console.log(Math.round(-3.4))   // -3
        console.log(Math.round(-3.6))   // -4


        // 绝对值
        console.log(Math.abs(1))
        console.log(Math.abs(-1))
        console.log(Math.abs('-1'))     // 隐式转换 会把字符串型的-1转换为数字型
        console.log(Math.abs('pink'))   // NaN


        // 最大最小值
        console.log(Math.max(1, 99, 33))        // 99
        console.log(Math.max(-1, -99))          // -1
        console.log(Math.min(-1, -99))          // -99
        console.log(Math.max(1, 99, 'pink'))    // NaN
        console.log(Math.max())                 // -Infinity
    </script>
</body>
</html>
