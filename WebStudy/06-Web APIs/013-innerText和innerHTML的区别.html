<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>innerText和innerHTML的区别</title>
</head>
<body>
    <div></div>
    <p>
        我是文字
        <span>123</span>
    </p>

    <script>
        // innerText 和 innerHTML的区别
        // 1. innerText 不识别 html 标签 非标准 去除空格和换行
        let div = document.querySelector('div')
        div.innerText = '今天<strong>天气真好</strong>！'
        // 结果：今天<strong>天气真好</strong>！
        
        // 2. innerHTML 能识别 html 标签 W3C标准 保留空格和换行
        div.innerHTML = '今天<strong>天气真好</strong>！'
        // 结果：今天天气真好！

        // 这两个属性是可以读写的 可以获取元素里面的内容
        let p = document.querySelector('p')
        console.log(p.innerText)
        // 结果：我是文字 123
        console.log(p.innerHTML)
        /* 结果：

            我是文字
            <span>123</span>
    
        */
    </script>
</body>
</html>
