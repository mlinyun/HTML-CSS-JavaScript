<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul,
        li {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .box {
            position: relative;
            width: 600px;
            height: 112px;
            /* background-color: pink; */
            border: 5px solid #000;
            margin: 100px auto;
            overflow: hidden;
        }

        .box ul {
            width: 2000px;
            height: 112px;
            animation: move 10s infinite linear;
        }

        .box:hover ul {
            animation-play-state: paused;
        }

        .box li {
            float: left;
            width: 200px;
            height: 112px;
        }

        .box li img {
            width: 200px;
        }

        @keyframes move {
            0% {
                transform: translate(0);
            }

            100% {
                /* 只展示到第7张图片，后面的123不展示，故只需要移动到1400px */
                transform: translate(-1400px);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li><img src="./images/001.jpg" alt=""></img></li>
            <li><img src="./images/002.jpg" alt=""></img></li>
            <li><img src="./images/003.jpg" alt=""></img></li>
            <li><img src="./images/004.jpg" alt=""></img></li>
            <li><img src="./images/005.jpg" alt=""></img></li>
            <li><img src="./images/006.jpg" alt=""></img></li>
            <li><img src="./images/007.jpg" alt=""></img></li>
            <!-- 第567张图片显示的时候，后面不能留白 -->
            <li><img src="./images/001.jpg" alt=""></img></li>
            <li><img src="./images/002.jpg" alt=""></img></li>
            <li><img src="./images/003.jpg" alt=""></img></li>
        </ul>
    </div>
</body>
</html>
