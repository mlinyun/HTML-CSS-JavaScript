<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型转换</title>
</head>
<body>
    <script>
        console.log(11 * '11');
        console.log(typeof(11 * '11'));
        console.log('121' / 11);
        console.log(typeof ('121' / 11));
        console.log(typeof(parseInt('100px')))
    </script>
</body>
</html>
