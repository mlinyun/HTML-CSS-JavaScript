<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>continue的使用</title>
</head>
<body>
    <script>
        // 1.求1~100之间，除了能被7整除之外的整数和
        let sum = 0
        for (let i = 1; i <= 100; i++) {
            if (i % 7 === 0) {
                continue
            }
            sum += i
        }
        console.log(`1~100之间，除了能被7整除之外的整数和是${sum}`)

        // 2.求1~100的累加和，但要求跳过所有个位数为3的数
        let sum1 = 0
        for (let i = 1; i <= 100; i++) {
            if (i % 10 === 3) {
                continue
            }
            sum1 += i
        }
        console.log(sum1)
    </script>
</body>
</html>
