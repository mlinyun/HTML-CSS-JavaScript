<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>005-jQuery基本和层级选择器</title>
    <script src="./js/jquery.min.js"></script>
</head>
<body>
    <div>我是div</div>
    <div class="nav">我是类名为nav的div</div>
    <p>我是p标签</p>
    <ol>
        <li>我是ol里的li</li>
        <li>我是ol里的li</li>
        <li>我是ol里的li</li>
        <li>我是ol里的li</li>
    </ol>
    <ul>
        <li>我是ul里的li</li>
        <li>我是ul里的li</li>
        <li>我是ul里的li</li>
        <li>我是ul里的li</li>
    </ul>
    <script>
        $(function() {
            // 获取类名为nav的元素，并在控制台里打印出来
            console.log($('.nav'))
            // 获取ul里面的所有li，并在控制台里打印出来
            console.log($('ul li'))
        })
    </script>
</body>
</html>
