<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淘宝固定侧边栏</title>
    <style>
        .slider-bar {
            position: absolute;
            top: 300px;
            left: 50%;
            width: 45px;
            height: 130px;
            margin-left: 600px;
            background-color: pink;
        }

        .w {
            width: 1200px;
            margin: 10px auto;
        }

        .header {
            height: 150px;
            background-color: purple;
        }

        .banner {
            height: 250px;
            background-color: skyblue;
        }

        .main {
            height: 1000px;
            background-color: yellowgreen;
        }

        span {
            display: none;
            position: absolute;
            bottom: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="slider-bar">
        <span class="goBack">返回顶部</span>
    </div>
    <div class="header w">头部区域</div>
    <div class="banner w">banner区域</div>
    <div class="main w">主体部分</div>
    <script>
        // 1. 获取元素
        let sliderBar = document.querySelector('.slider-bar')
        let banner = document.querySelector('.banner')
        // banner.offsetTop 就是被卷去头部的大小 一定要写滚动的外面
        let bannerTop = banner.offsetTop
        let sliderBarTop = sliderBar.offsetTop - bannerTop
        // 获取main 主体元素
        let main = document.querySelector('.main')
        let goBack = document.querySelector('.goBack')
        let mainTop = main.offsetTop
        // 2. 页面滚动事件 scroll
        document.addEventListener('scroll', function() {
            // window.pageYOffset 页面被卷去的头部
            // console.log(window.pageYOffset)
            // 3. 当我们页面被卷去的头部大于等于了 172px 此时 侧边栏就要改成固定定位
            if (window.pageYOffset >= bannerTop) {
                sliderBar.style.position = 'fixed'
                sliderBar.style.top = sliderBarTop + 'px'
            } else {
                sliderBar.style.position = 'absolute'
                sliderBar.style.top = '300px'
            }

            // 4. 但我们的页面滚动到main盒子时，就显示 goback模块
            if (window.pageYOffset >= mainTop) {
                goBack.style.display = 'block'
            } else {
                goBack.style.display = 'none'
            }
        })

        // 5. 当我们点击了返回顶部模块，就让窗口滚动到页面的最上方
        goBack.addEventListener('click', function() {
            // 里面的x, y不需要加单位
            // window.scroll(0, 0)
            // 因为是窗口滚动，所以对象是window
            animate(window, 0)
        })

        // 缓动函数
        function animate(obj, target, callback) {
            clearInterval(obj.timer)
            obj.timer = setInterval(function() {
                obj.step = (target - window.pageYOffset) / 10
                obj.step = obj.step <= 0 ? Math.floor(obj.step) : Math.ceil(obj.step)
                if (window.pageYOffset === target) {
                    clearInterval(obj.timer)
                    // if (callback) {
                    //     callback()
                    // }
                    callback && callback()
                } else {
                    window.scroll(0, window.pageYOffset + obj.step)
                }
            }, 15)
        }
    </script>
</body>
</html>
