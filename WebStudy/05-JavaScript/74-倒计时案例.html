<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时案例</title>
</head>
<body>
    <script>
        // 封装倒计时函数
        function countDown(time) {
            // 声明变量nowTime保存当前时间总的毫秒数
            let nowTime = +new Date()
            // 声明变量inputTime保存用户输入时间总的毫秒数
            let inputTime = +new Date(time)
            // times是剩余总的秒数，注意毫秒和秒的进制为1000
            let times = (inputTime - nowTime) / 1000
            // 计算天数
            let d = parseInt(times / 60 / 60 / 24)
            // 计算小时
            let h = parseInt(times / 60 / 60 % 24) 
            // 计算分钟数
            let m = parseInt(times / 60 % 60)
            // 计算当前秒数
            let s = parseInt(times % 60)
            // 时间补零
            d = d >= 10 ? d : '0' + d
            h = h >= 10 ? h : '0' + h
            m = m >= 10 ? m : '0' + m
            s = s >= 10 ? s : '0' + s
            alert(`剩余的时间时${d}天${h}时${m}分${s}秒`)
        }

        let time = prompt('请输入截至时间（格式：xxxx-xx-xx或者xxxx/xx/xx）')
        countDown(time)
    </script>
</body>
</html>
