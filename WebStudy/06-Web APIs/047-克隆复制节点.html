<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克隆复制节点</title>
</head>
<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>
    <script>
        let ul = document.querySelector('ul')
        // 1. node.cloneNode() 括号为空或者里面是false 浅拷贝 只复制标签，不复制里面的内容
        // 2. node.cloneNode(true) 括号为true 深度拷贝 复制标签里面的内容
        let lili = ul.children[0].cloneNode(true)
        ul.appendChild(lili)
    </script>
</body>
</html>
