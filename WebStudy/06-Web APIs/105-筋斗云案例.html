<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筋斗云案例</title>
    <style>
        * {
            margin: 0;
            padding: 0
        }
        
        ul {
            list-style: none;
        }
        
        body {
            background-color: black;
        }
        
        .c-nav {
            width: 900px;
            height: 42px;
            background: #fff url(images/rss.png) no-repeat right center;
            margin: 100px auto;
            border-radius: 5px;
            position: relative;
        }
        
        .c-nav ul {
            position: absolute;
        }
        
        .c-nav li {
            float: left;
            width: 83px;
            text-align: center;
            line-height: 42px;
        }
        
        .c-nav li a {
            color: #333;
            text-decoration: none;
            display: inline-block;
            height: 42px;
        }
        
        .c-nav li a:hover {
            color: white;
        }

        .c-nav li.current a {
            color: #0dff1d;
        }
        
        .cloud {
            position: absolute;
            left: 0;
            top: 0;
            width: 83px;
            height: 42px;
            background: url(images/cloud.gif) no-repeat;
        }
    </style>
    <!-- 引入缓动动画函数 -->
    <script src="101-animate.js"></script>
    <script>
        window.addEventListener('load', function() {
            // 1. 获取元素
            let cloud = document.querySelector('.cloud')
            let c_nav = document.querySelector('.c-nav')
            let lis = c_nav.querySelectorAll('li')
            // 2. 给所有的小li绑定事件
            for (let i = 0; i < lis.length; i++) {
                // (1) 鼠标经过把当前小li的位置作为目标值
                lis[i].addEventListener('mouseenter', function() {
                    animate(cloud, i * this.offsetWidth)
                    // animate(cloud, this.offsetLeft)
                })
                // (2) 鼠标离开就复原为0
                // lis[i].addEventListener('mouseleave', function() {
                //     animate(cloud, 0)
                // })

                lis[i].addEventListener('mouseleave', fn)

                function fn() {
                    animate(cloud, 0)
                }
                // (3) 当我们点击鼠标，就把当前位置作为目标值
                lis[i].addEventListener('click', function() {
                    // cloud.style.left = i * this.offsetWidth + 'px'
                    cloud.style.left = this.offsetLeft + 'px'
                    lis[i].removeEventListener('mouseleave', fn)
                })
            }
        })
    </script>
</head>
<body>
    <div id="c_nav" class="c-nav">
        <span class="cloud"></span>
        <ul>
            <li class="current"><a href="javascript:;">首页新闻</a></li>
            <li><a href="javascript:;">师资力量</a></li>
            <li><a href="javascript:;">活动策划</a></li>
            <li><a href="javascript:;">企业文化</a></li>
            <li><a href="javascript:;">招聘信息</a></li>
            <li><a href="javascript:;">公司简介</a></li>
            <li><a href="javascript:;">我是佩奇</a></li>
            <li><a href="javascript:;">啥是佩奇</a></li>
        </ul>
    </div>
</body>
</html>
