<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦幻西游</title>
    <style>
        body {
            position: relative;
            background-image: url("./images/mhxybg.webp");
        }
        
        footer {
            position: absolute;
            top: 400px;
            left: 50%;
            width: 760px;
            height: 240px;
            /* ps */
            /* background-color: pink; */
            /* margin: 300px auto; */
            transform: translate(-50%, 0);
        }

        .west {
            float: left;
            width: 190px;
            height: 240px;
            /* ps */
            /* background-color: skyblue; */
            animation: player1 1.4s steps(8) infinite;
        }

        .west:first-child {
            background: url("./images/west_01.png") no-repeat 0 0;
        }

        .west:nth-child(2) {
            background: url("./images/west_02.png") no-repeat 0 0;
        }

        .west:nth-child(3) {
            background: url("./images/west_03.png") no-repeat 0 0;
            animation: player2 1.4s steps(8) infinite;
        }

        .west:last-child {
            background: url("./images/west_04.png") no-repeat 0 0;
            animation: player3 1.4s steps(8) infinite;
        }

        @keyframes player1 {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -1600px 0;
            }
        }

        @keyframes player2 {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -1360px 0;
            }
        }

        @keyframes player3 {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -1680px 0;
            }
        }
    </style>
</head>
<body>
    <footer>
        <div class="west"></div>
        <div class="west"></div>
        <div class="west"></div>
        <div class="west"></div>
    </footer>
</body>
</html>
