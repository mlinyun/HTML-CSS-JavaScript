    <script>
        // 需求：查找字符串 'abcoefoxyozzopp' 中所有o出现的位置以及次数
        let str = 'abcoefoxyozzopp'
        let arr = []
        for (let i = 0; i < str.length; i++) {
            let index = str.indexOf('o', i)
            if (index !== -1) {
                if (arr.indexOf(index) === -1) {
                    arr.push(index)
                    // index++
                }
            }
        }
        console.log(arr)    // [3, 6, 9, 12]
        console.log(arr.length) // o出现的次数
