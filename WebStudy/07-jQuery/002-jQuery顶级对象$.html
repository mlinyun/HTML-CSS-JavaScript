<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>002-jQuery顶级对象</title>
    <script src="./js/jquery.min.js"></script>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div></div>
    <script>
        // 1. $ 是 jQuery的别称（另外的名字）
        $(function() {
            alert(11)
        })
        // 也可以这样写
        jQuery(function() {
            jQuery('div').hide()
        })

        // 2. $ 同时也是jQuery的 顶级对象，相当于原生JavaScript中的window
    </script>
</body>
</html>
