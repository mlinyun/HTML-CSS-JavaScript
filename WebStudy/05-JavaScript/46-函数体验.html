<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数体验</title>
</head>
<body>
    <script>
        // 封装计算n~m之间所有整数的累加和
        function getSum(num1, num2) {
            let sum = 0
            for (let i = num1; i <= num2; i++) {
                sum += i
            }
            return sum
        }
        console.log(getSum(1, 100))
    </script>
</body>
</html>
