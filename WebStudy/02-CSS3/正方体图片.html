<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 100px auto;
            transition: all 5s;
            transform-style: preserve-3d;
            transform: rotateX(-10deg) rotateY(60deg);
        }

        .box:hover {
            transform: rotateX(-10deg) rotateY(60deg) rotateY(360deg);
        }

        .box div {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            background-color: pink;
        }

        .box img {
            width: 200px;
            height: 200px;
        }

        .box .pic1 {
            transform: translateZ(200px);
        }

        .box .pic2 {
            transform-origin: 100% 50%;
            transform: rotateY(90deg);
            background-color: skyblue;
        }

        .box .pic3 {
            transform-origin: 0% 50%;
            transform: rotateY(-90deg);
            background-color: yellow;
        }

        .box .pic4 {
            background-color: purple;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="pic1"><img src="./images/01.png" alt=""></div>
        <div class="pic2"><img src="./images/02.png" alt=""></div>
        <div class="pic3"><img src="./images/03.png" alt=""></div>
        <div class="pic4"><img src="./images/04.jpg" alt=""></div>
    </div>
</body>
</html>
