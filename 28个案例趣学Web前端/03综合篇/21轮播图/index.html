<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮播图</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="carousel__wrapper">
        <button class="carousel__button carousel__button--left">
            <svg
                aria-hidden="true"
                stroke="currentColor"
                fill="currentColor"
                stroke-width="0"
                viewBox="0 0 512 512"
                width="1em"
                heigth="1em"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M256 504C119 504 8 393 8 256S119 8 256 8s248 111 248 248-111 248-248 248zM142.1 273l135.5 135.5c9.4 9.4 24.6 9.4 33.9 0l17-17c9.4-9.4 9.4-24.6 0-33.9L226.9 256l101.6-101.6c9.4-9.4 9.4-24.6 0-33.9l-17-17c-9.4-9.4-24.6-9.4-33.9 0L142.1 239c-9.4 9.4-9.4 24.6 0 34z"
                >
                </path>
            </svg>
        </button>
        <button class="carousel__button carousel__button--right">
            <svg
                aria-hidden="true"
                stroke="currentColor"
                fill="currentColor"
                stroke-width="0"
                viewBox="0 0 512 512"
                width="1em"
                heigth="1em"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                    d="M256 8c137 0 248 111 248 248S393 504 256 504 8 393 8 256 119 8 256 8zm113.9 231L234.4 103.5c-9.4-9.4-24.6-9.4-33.9 0l-17 17c-9.4 9.4-9.4 24.6 0 33.9L285.1 256 183.5 357.6c-9.4 9.4-9.4 24.6 0 33.9l17 17c9.4 9.4 24.6 9.4 33.9 0L369.9 273c9.4-9.4 9.4-24.6 0-34z"
                >
                </path>
            </svg>
        </button>
        <div class="carousel__scroll-area">
            <figure>
                <img src="./img/1.png" alt="" width="853" height="480">
                <figcaption>加拿大 奥托克斯 紫丁香</figcaption>
            </figure>
            <figure>
                <img src="./img/2.png" alt="" width="853" height="480">
                <figcaption>澳大利亚 海浪向岸边的高角度摄影</figcaption>
            </figure>
            <figure>
                <img src="./img/3.png" alt="" width="853" height="480" objectFit="cover">
                <figcaption>哈雷阿卡拉 日落时的云</figcaption>
            </figure>
            <figure>
                <img src="./img/4.png" alt="" width="853" height="480" objectFit="cover">
                <figcaption>日本 冈山县 白花</figcaption>
            </figure>
            <figure>
                <img src="./img/5.png" alt="" width="853" height="480">
                <figcaption>水下 海葵 水族馆背景</figcaption>
            </figure>
        </div>
    </div>
    <script src="./js/index.js"></script>
</body>
</html>
