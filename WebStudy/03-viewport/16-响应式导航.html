<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul {
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        nav {
            clear: both;
        }

        ul li {
            float: left;
            width: 1.25rem;
            height: 30px;
            line-height: 30px;
            background-color: green;
            text-align: center;
            font-size: 16px;
        }

        ul li a {
            color: #fff;
        }

        @media screen and (max-width: 768px) {
            nav {
                width: 100%;
            }

            nav li {
                width: 33.33%;
            }
        }

        @media screen and (min-width: 768px) {
            html {
                font-size: 75px;
            }

            nav {
                width: 750px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">导航1</a></li>
            <li><a href="#">导航2</a></li>
            <li><a href="#">导航3</a></li>
            <li><a href="#">导航4</a></li>
            <li><a href="#">导航5</a></li>
            <li><a href="#">导航6</a></li>
            <li><a href="#">导航7</a></li>
            <li><a href="#">导航8</a></li>
        </ul>
    </nav>
</body>
</html>
