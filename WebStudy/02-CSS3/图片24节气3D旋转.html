<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 460.8px;
            height: 259.2px;
            margin: 200px auto;
            /* background-color: pink; */
        }

        .box ul {
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-15deg);
            animation: change 30s infinite linear;
        }

        .box ul:hover {
            animation-play-state: paused;
        }

        li {
            list-style: none;
        }

        .box li {
            position: absolute;
            top: 0;
            left: 0;
        }


        .box li img {
            width: 100%;
        }

        .pic1 {
            transform: rotateY(0deg) translateZ(660px);
        }

        .pic2 {
            transform: rotateY(40deg) translateZ(660px);
        }

        .pic3 {
            transform: rotateY(80deg) translateZ(660px);
        }

        .pic4 {
            transform: rotateY(120deg) translateZ(660px);
        }

        .pic5 {
            transform: rotateY(160deg) translateZ(660px);
        }

        .pic6 {
            transform: rotateY(200deg) translateZ(660px);
        }

        .pic7 {
            transform: rotateY(240deg) translateZ(660px);
        }

        .pic8 {
            transform: rotateY(280deg) translateZ(660px);
        }

        .pic9 {
            transform: rotateY(320deg) translateZ(660px);
        }

        @keyframes change {
            0% {
                transform: rotateX(-15deg) rotateY(0deg);
            }

            100% {
                transform: rotateX(-15deg) rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li class="pic1"><img src="./images/DAIMGX00001.png" alt=""></li>
            <li class="pic2"><img src="./images/DAIMGX00002.png" alt=""></li>
            <li class="pic3"><img src="./images/DAIMGX00003.png" alt=""></li>
            <li class="pic4"><img src="./images/DAIMGX00004.png" alt=""></li>
            <li class="pic5"><img src="./images/DAIMGX00005.png" alt=""></li>
            <li class="pic6"><img src="./images/DAIMGX00006.png" alt=""></li>
            <li class="pic7"><img src="./images/DAIMGX00007.png" alt=""></li>
            <li class="pic8"><img src="./images/DAIMGX00008.png" alt=""></li>
            <li class="pic9"><img src="./images/DAIMGX00009.png" alt=""></li>
        </ul>
    </div>
</body>
</html>
