<!DOCTYPE html>
<html lang="zh">
<head>
	<meta charset="UTF-8">
	<title>CSS尺寸</title>
</head>
<!--知识点： width:auto/长度/百分比/inherit
     height:auto/长度/百分比/inherit
	 min-width，max-width,min-height,max-height:长度/百分比/inherit
-->
<!-- 请根据段落提示补全以下代码 -->
<body>
	<div>
		<p>图片原始大小130*122</p>
		<img src="./img/bird.png" alt="小鸟">
		<p>设置最大宽度80px</p>
		<img src="./img/bird.png" alt="小鸟" style="max-width: 80px;">
		<p>设置最小宽度180px</p>
		<img src="./img/bird.png" alt="小鸟" style="min-width: 180px">
		<p>设置宽高与标准尺寸比例不同，宽80px,高150px</p>
		<img src="./img/bird.png" alt="小鸟" style="width: 80px; height: 150px;">
		<p>用百分比设置宽高80%，80%</p>
		<div style="background-color: #ADD8E6;width:300px;height: 300px;">
			<img src="./img/bird.png" alt="小鸟" style="width: 80%; height: 80%;">
		</div>
	</div>
</body>
</html>
