<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>62-用HTML&CSS写一个信息展示的卡片效果</title>
    <link rel="stylesheet" href="./css/62-用HTML&CSS写一个信息展示的卡片效果.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.css">
</head>

<body>
    <section class="profile">
        <div class="container">
            <img src="img/62-img/img.jpg">

                <h1>web前端开发</h1>
                <h4>一个前端技术学习平台，博客网站，www.baidu.com</h4>
            </div>
            <div class="icons">
                <a href="#"><i class='fa fa-weixin'></i></a>

                <a href="#"><i class='fa fa-github-square' ></i></a>
                <a href="#"><i class='fa fa-renren' ></i></a>
                <a href="#"><i class='fa fa-qq' ></i></a>
            </div>
            <div class="newslatter">
                <form>
                    <input type="email" placeholder="输入你的邮箱地址" required>
                    <input type="submit" value="立即订阅" required>
                </form>
            </div>
        </div>
