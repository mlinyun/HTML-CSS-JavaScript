<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变量的作用域 - 块级作用域</title>
</head>
<body>
    <script>
        // 在 {} 内使用 let 声明的变量 只在 {} 内有效
        // if (true) {
        //     let num1 = 18
        //     console.log(num1)
        // }   // 18
        // console.log(num1)    // 报错：Uncaught ReferenceError: num is not defined

        // for (let i = 1; i <= 5; i++) {
        //     console.log(i)
        // }   // 12345
        // console.log(i)  // 报错：Uncaught ReferenceError: i is not defined

        // 在 {} 内使用 var 声明的变量 在 {} 外也有效
        if (true) {
            var num2 = 18
            console.log(num2)
        }   // 18
        console.log(num2)   // 18

        for (var i = 1; i <= 5; i++) {
            console.log(i)
        }   // 12345
        console.log(i)  // 6
    </script>
</body>
</html>
