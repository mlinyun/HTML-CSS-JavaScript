<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拖动模块框</title>
    <style>
        /* 初始样式 */
        ul,
        ol,
        li,
        dl,
        dt,
        dd,
        div,
        p,
        span,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        a {
            margin: 0;
            padding: 0;
        }

        a {
            text-decoration: none;
            color: #000;
        }

        .login-header {
            width: 100%;
            text-align: center;
            height: 30px;
            font-size: 24px;
            line-height: 30px;
        }

        .login {
            display: none;
            position: relative;
            width: 512px;
            height: 280px;
            position: fixed;
            top: 50%;
            left: 50%;
            border: 1px solid#ebebeb;
            background-color: #fff;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #ddd;
            z-index: 9999;
        }

        .login-title {
            position: relative;
            width: 100%;
            height: 40px;
            line-height: 40px;
            margin: 10px 0px 0px 0px;
            text-align: center;
            font-size: 18px;
            cursor: move;
        }

        .login-title span {
            position: absolute;
            top: -30px;
            right: -20px;
            width: 40px;
            height: 40px;
            font-size: 12px;
            background-color: #fff;
            border-radius: 50%;
            border: 1px solid#ebebeb;
        }

        .login-input-content {
            margin-top: 20px;
        }

        .login-input {
            overflow: hidden;
            margin: 0 0 20px 0;
        }

        .login-input label {
            float: left;
            width: 90px;
            height: 35px;
            line-height: 35px;
            text-align: right;
            padding-right: 10px;
            font-size: 14px;
        }

        .login-input input.list-input {
            float: left;
            width: 350px;
            height: 35px;
            line-height: 35px;
            border: 1px solid #ebebeb;
            text-indent: 5px;
        }

        .login-button {
            width: 50%;
            height: 40px;
            line-height: 40px;
            margin: 30px auto 0 auto;
            font-size: 14px;
            border: 1px solid #ebebeb;
            text-align: center;
        }

        .login-button a {
            display: block;
        }

        .login-bg {
            display: none;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background-color: rgba(0, 0, 0, .3);
        }
    </style>
</head>
<body>
    <div class="login-header"><a href="javascript:;" id="link">点击，弹出登录框</a></div>
    <div id="login" class="login">
        <div id="title" class="login-title">登录会员
            <span><a href="javascript:void();" id="closeBtn" class="close-login">关闭</a></span>
        </div>
        <div class="login-input-content">
            <div class="login-input">
                <label for="username">用户名：</label>
                <input type="text" placeholder="请输入用户名" name="info[username]" id="username" class="list-input">
            </div>
            <div class="login-input">
                <label for="password">登录密码：</label>
                <input type="password" placeholder="请输入登录密码" name="info[password]]" id="password" class="list-input">
            </div>
        </div>
        <div id="loginBtn" class="login-button"><a href="javascript:void();" id="login-button-submit">登录会员</a></div>
    </div>
    <!-- 遮盖层 -->
    <div id="bg" class="login-bg"></div>
    <script>
        // 1. 获取需要操作元素
        let link = document.querySelector('#link')
        let login = document.querySelector('.login')
        let mask = document.querySelector('.login-bg')
        let closeBtn = document.querySelector('#closeBtn')
        let title = document.querySelector('#title')

        // 2. 点击弹出层这个链接 link 让 mask 和 login 显示出来
        link.addEventListener('click', function() {
            login.style.display = 'block'
            mask.style.display = 'block'
        })

        // 3. 点击 closeBtn 就隐藏 mask 和 login
        closeBtn.addEventListener('click', function() {
            login.style.display = 'none'
            mask.style.display = 'none'
        })

        // 4. 开始拖拽
        title.addEventListener('mousedown', function(e) {
            // (1) 当我们鼠标按下，就获得鼠标在盒子内的坐标
            let x = e.pageX - login.offsetLeft
            let y = e.pageY - login.offsetTop

            // (2) 鼠标移动的时候，把鼠标在页面中的坐标，减去 鼠标在盒子内的坐标就是模态框的 left 和 top 的值
            // 注意：鼠标移动事件在整个页面中都可以，所以这里的事件源是 document
            // 这里不要使用匿名函数注册鼠标移动事件，因为该事件执行结束后要移除该事件
            document.addEventListener('mousemove', move)

            function move(e) {
                login.style.left = e.pageX - x + 'px'
                login.style.top = e.pageY - y + 'px'
            }

            // (3) 鼠标弹起，就让鼠标移动事件移除
            document.addEventListener('mouseup', function() {
                document.removeEventListener('mousemove', move)
            })
        })
    </script>
</body>
</html>
