<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组元素去重案例</title>
</head>
<body>
    <script>
        // 需求：有一个数组 ['c', 'a', 'z', 'a', 'x', 'a', 'x', 'c', 'b'] ，要求去除数组中重复的元素
        // 封装一个数组去重的函数
        function unique(arr) {
            let newArr = []
            for (let i = 0; i < arr.length; i++) {
                if (newArr.indexOf(arr[i]) === -1) {
                    newArr.push(arr[i])
                }
            }
            return newArr
        }

        let arr = ['c', 'a', 'z', 'a', 'x', 'a', 'x', 'c', 'b']
        let new_arr = unique(arr)
        console.log(new_arr)	// ['c', 'a', 'z', 'x', 'b']
    </script>
</body>
</html>
