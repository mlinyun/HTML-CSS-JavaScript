<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5s后关闭广告</title>
</head>
<body>
    <img src="./images/ad.jpg" class="ad">
    <script>
        // 获取要操作的元素
        let ad = document.querySelector('.ad')
        // 开启定时器
        setTimeout(function() {
            ad.style.display = 'none'
        }, 5000)
    </script>
</body>
</html>
