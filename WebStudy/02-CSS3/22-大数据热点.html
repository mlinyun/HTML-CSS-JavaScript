<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大数据热点</title>
    <style>
        .box {
            position: relative;
            width: 747px;
            height: 617px;
            margin: 100px auto;
            background-color: pink;
        }

        .box .city {
            position: absolute;
            top: 200px;
            right: 200px;
        }

        .box .two {
            top: 300px;
            right: 400px;
        }

        .box .three {
            top: 500px;
            right: 300px;
        }

        .box .city .dotted {
            width: 8px;
            height: 8px;
            background-color: #09f;
            border-radius: 50%;
        }

        .box div[class^="pulse"] {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            box-shadow: 0 0 10px #009dfd;
            border-radius: 50%;
            animation: pulse 1.2s linear infinite;
        }

        .box div.pulse2 {
            animation-delay: .4s;
        }

        .box div.pulse3 {
            animation-delay: .6s;
        }

        @keyframes pulse {
            0% {
                width: 8px;
                height: 8px;
            }

            75% {
                width: 40px;
                height: 40px;
                opacity: 1;
            }

            100% {
                width: 70px;
                height: 70px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="city">
            <div class="dotted"></div>
            <div class="pulse1"></div>
            <div class="pulse2"></div>
            <div class="pulse3"></div>
        </div>
        <div class="city two">
            <div class="dotted"></div>
            <div class="pulse1"></div>
            <div class="pulse2"></div>
            <div class="pulse3"></div>
        </div>
        <div class="city three">
            <div class="dotted"></div>
            <div class="pulse1"></div>
            <div class="pulse2"></div>
            <div class="pulse3"></div>
        </div>
    </div>
</body>
</html>
