<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冒泡排序</title>
</head>
<body>
    <script>
        let arr = [5, 4, 3, 2, 1]
        // 外层循环控制趟数：arr.length - 1
        for (let i = 0; i < arr.length - 1; i++) {
            // 内层循环控制次数：arr.length - 1 - i
            for (let j = 0; j < arr.length - 1 - i; j++) {
                // 如果前一个元素的值大于后面的元素时：交换两个变量的值
                if (arr[j] > arr[j + 1]) {
                    let temp = arr[j]
                    arr[j] = arr[j + 1]
                    arr[j + 1] = temp
                }
            }
        }
        console.log(arr)
    </script>
</body>
</html>
