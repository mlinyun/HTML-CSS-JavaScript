<!DOCTYPE html>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算两数之和</title>
</head>
<body>
    <script>
        let num1 = +prompt('请您输入第一个数：')
        let num2 = +prompt('请您输入第二个数：')
        alert(`${num1} + ${num2} = ${num1 + num2}`)
    </script>
