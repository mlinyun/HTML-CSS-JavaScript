<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数组倒置</title>
</head>
<body>
    <script>
        function reverse(arr) {
            let new_arr = []
            if (arr instanceof Array) {
                for (let i = 0; i < arr.length; i++) {
                new_arr[new_arr.length] = arr[arr.length - i - 1]
                }
                return new_arr
            } else {
                return 'error 这个参数要求必须是数组格式，像[1, 2, 3, 4, 5, 6]'
            }
        }

        let re = reverse([1, 2, 3, 4, 5, 6])
        console.log(re)					// [6, 5, 4, 3, 2, 1]
        let re1 = reverse(1, 2, 3)
        console.log(re1)				// error 这个参数要求必须是数组格式，像[1, 2, 3, 4, 5, 6]
    </script>
</body>
</html>
