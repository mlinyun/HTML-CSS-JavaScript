<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript输入输出语句</title>
</head>
<body>
    <script>
        // 这是一个输入框 输入的 让用户输入的
        prompt('请输入您的年龄')

        // 在页面中输出内容，可以识别标签
        document.write('我愿意')
        document.write('<h1>我是标题1</h1>')
        
        // 弹出警示框   输出的 展示给用户看的
        alert('计算的结果是')

        // 在控制台中输出   给程序员测试使用的
        console.log('我是程序员可以看见的');
    </script>
</body>
</html>
