<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-CSS实现留言板效果</title>
    <link rel="stylesheet" href="./css/27-CSS实现留言板效果.css">
</head>

<body>
    <section>
        <div class="container">
            <div class="contactinfo">
                <div>
                    <h2>联系方式</h2>
                    <ul class="info">
                        <li>
                            <span><img src="img/27-img/location.png"></span>
                            <span>地球-世界-中国-上海-闵行区-东川路</span>
                        </li>
                        <li>
                            <span><img src="img/27-img/mail.png"></span>
                            <span>13127757553@163.com</span>
                        </li>
                        <li>
                            <span><img src="img/27-img/call.png"></span>
                            <span>13127757553</span>
                        </li>
                    </ul>
                </div>
                <ul class="sci">
                    <li>
                        <a href="javascript:;"><img src="1.png"></a>
                    </li>
                    <li>
                        <a href="javascript:;"><img src="2.png"></a>
                    </li>
                    <li>
                        <a href="javascript:;"><img src="3.png"></a>
                    </li>
                    <li>
                        <a href="javascript:;"><img src="4.png"></a>
                    </li>
                    <li>
                        <a href="javascript:;"><img src="5.png"></a>
                    </li>
                </ul>
            </div>
            <div class="contactForm">
                <h2>留言联系</h2>
                <div class="formBox">
                    <div class="inputBox w50">
                        <input type="text" name="" required>
                        <span>昵称</span>
                    </div>
                    <div class="inputBox w50">
                        <input type="text" name="" required>
                        <span>姓名</span>
                    </div>
                    <div class="inputBox w50">
                        <input type="text" name="" required>
                        <span>邮箱地址</span>
                    </div>
                    <div class="inputBox w50">
                        <input type="text" name="" required>
                        <span>联系电话</span>
                    </div>
                    <div class="inputBox w100">
                        <textarea name="" required></textarea>
                        <span>有什么问题请留言，我会尽快给你回复</span>
                    </div>
                    <div class="inputBox w100">
                        <input type="submit" value="提交">
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
