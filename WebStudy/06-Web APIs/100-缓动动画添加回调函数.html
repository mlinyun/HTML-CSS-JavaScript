<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓动动画添加回调函数</title>
    <style>
        div {
            position: absolute;
            left: 0;
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <button class="btn500">点击移动500</button>
    <button class="btn800">点击移动800</button>
    <div></div>
    <script>
        // 定义动画
        function animate(obj, target, callback) {
            // 将函数作为参数传递给另一个函数
            clearInterval(obj.timer)
            obj.timer = setInterval(function() {
                obj.step = (target - obj.offsetLeft) / 10
                obj.step = obj.step <= 0 ? Math.floor(obj.step) : Math.ceil(obj.step)
                if (obj.offsetLeft === target) {
                    clearInterval(obj.timer)
                    // 回调函数写到定时器结束里面
                    // 如果该参数存在，则执行该参数传递进来的函数
                    if (callback) {
                        callback()
                    }
                } else {
                    obj.style.left = obj.offsetLeft + obj.step + 'px'
                }
            }, 15)
        }

        // 获取元素
        let div = document.querySelector('div')
        let btn500 = document.querySelector('.btn500')
        let btn800 = document.querySelector('.btn800')

        // 调用函数
        btn500.addEventListener('click', function() {
            animate(div, 500, function() {
                div.style.backgroundColor = 'skyblue'
            })
        })

        btn800.addEventListener('click', function() {
            animate(div, 800, function() {
                div.style.backgroundColor = 'purple'
            })
        })
    </script>
</body>
</html>
