<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度换肤</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: url("./images/1.jpg") no-repeat;
        }

        .box {
            width: 320px;
            height: 50px;
            margin: 100px auto;
        }

        .box li {
            float: left;
            width: 80px;
            height: 50px;
            box-sizing: border-box;
            list-style: none;
            background-color: pink;
            cursor: pointer;
        }

        .box img {
            width: 80px;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li><img src="./images/1.jpg" alt=""></li>
            <li><img src="./images/2.jpg" alt=""></li>
            <li><img src="./images/3.jpg" alt=""></li>
            <li><img src="./images/4.jpg" alt=""></li>
        </ul>
    </div>

    <script>
        // 第一种
        // 1. 获取所有的li
        let lis = document.querySelector('.box').querySelectorAll('ul li')
        // 2. 循环监听事件 (循环注册事件)
        for (let i = 0; i < lis.length; i++) {
            lis[i].addEventListener('click', function() {
                // 根据图片的命名格式可以知道，i + 1 就是图片的路径了
                document.body.style.backgroundImage = `url('./images/${i + 1}.jpg')`
            })
        }

        // 第二种
        // 1. 获取所有的img
        let imgs = document.querySelector('.box').querySelectorAll('ul img')
        // 2. 循环监听事件 (循环注册事件)
        for (let i = 0; i < imgs.length; i++) {
            imgs[i].addEventListener('click', function() {
                // this.src 就是我们点击图片的路径
                // 把这个路径 this.src 给body 就可以了
                document.body.style.backgroundImage = `url(${this.src})`
            })
        }
    </script>
</body>
</html>
