<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作作数组 - 删除元素练习案例</title>
</head>
<body>
    <script>
        // 需求：将数组 [2, 0, 6, 10, 77, 0, 25, 7] 中的0去掉后，形成一个不包含0的新数组
        let arr = [2, 0, 6, 10, 77, 0, 25, 7]
        for (let i = 0; i < arr.length; i++) {
            if (arr[i] === 0) {
                arr.splice(i, 1)
            }
        }
        console.log(arr)
    </script>
</body>
</html>
