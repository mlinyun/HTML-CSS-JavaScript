<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取设置自定义属性</title>
</head>
<body>
    <div id="deom" index="1"></div>
    <!-- 这里的 index属性 是程序员自定义的 -->
    <script>
        // 1 获取元素属性值
        let div = document.querySelector('div')
        // 1.1 获取内置属性：element.属性(元素本身自带的属性)
        console.log(div.id)
        // 1.2 获取自定义属性：element.getAttribute(我们程序员自定义的属性)
        console.log(div.getAttribute('id'))
        console.log(div.index)   // undefined
        console.log(div.getAttribute('index'))

        // 2 设置元素属性值
        // 2.1 设置内置属性值：element.属性 = '值'
        div.id = 'test'
        console.log(div.id)
        div.className = 'navs'     // 获取元素的class属性，注意使用className，不要使用class
        console.log(div.className)
        // 2.2 设置自定义属性值：element.setAttribute('要修改的属性'，'属性值')
        div.setAttribute('index', 2)
        console.log(div.getAttribute('index'))
        // 这里的class特殊，这里不需要写 className，直接写 class就行
        div.setAttribute('class', 'footer')
        console.log(div.className)

        // 3 移除元素属性
        // 3.1 移除内置属性   element.属性 = ''
        div.id = ''
        console.log(div.id)
        // 3.2 移除自定义属性   element.removeAttribute()
        div.removeAttribute('index')
        console.log(div.getAttribute('index'));
    </script>
    <!-- 自定义属性获取是通过getAttribute('属性')获取 -->
    <!-- 当有些自定义属性很容易引起歧义，不容易判断是元素内置属性还是自定义属性 -->
    <!-- 因此，H5给我们新增了一个规定 -->
    <!-- 设置H5自定义属性：H5规定自定义属性以 data-开头做为属性名并且赋值 -->
    <div data-index="1" id="div" data-list-name="30"></div>
    <!-- 或者 通过setAttribute()设置自定义属性 -->
    <script>
        let divs = document.getElementById('div')
        divs.setAttribute('data-time', 20)

        // 获取H5自定义属性
        // element.getAttribute('属性')
        console.log(divs.getAttribute('data-time'))
        // H5新增的获取自定义属性的方法 ie11才支持且只能获取data-开头的自定义属性
        // element.dataset.属性 或者 element.dataset['属性']
        console.log(divs.dataset.time)
        console.log(divs.dataset['time'])
        // 如果自定义属性里面有多个-链接的单词，我使用H5新增的获取属性采取小驼峰命名法
        console.log(divs.dataset.listName)
        console.log(divs.dataset['listName'])
    </script>
</body>
</html>
