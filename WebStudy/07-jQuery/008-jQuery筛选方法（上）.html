<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>008-jQuery筛选方法（上）</title>
    <script src="./js/jquery.min.js"></script>
</head>
<body>
    <div class="grandfather">
        <div class="father">
            <div class="son">儿子</div>
        </div>
    </div>
    <div class="nav">
        <p>我是p标签</p>
        <div>
            <p>我也是p标签</p>
        </div>
    </div>
    <script>
        // 注意一下下面使用的是方法，要带括号
        $(function() {
            // 1. 父 parent() 返回的是最近一级的父级元素 亲爸爸
            console.log($('.son').parent());

            // 2. 子
            // 2.1 亲儿子 children() 子代选择器 ul>li
            $('.nav').children('p').css('color', 'red')
            // 2.2 可以选择里面所有的儿子
            $('.nav').children().css('backgroundColor', 'pink')
            // 2.3 可选择里面所有的孩子 包括儿子和孙子 find()
            $('.nav').find('p').css('color', 'blue')

            // 3. 兄弟元素
        })
    </script>
</body>
</html>
