<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul {
            display: flex;
            justify-content: center;
            margin-top: 200px;
        }

        ul li {
            /* float: left; */
            overflow: hidden;
            margin-right: 10px;
            width: 199px;
            height: 290px;
            border: 1px solid hotpink;
            list-style: none;
            background: url("./images/10.jpg") no-repeat;
            background-size: contain;
        }

        ul li:nth-child(2) {
            background-image: url("./images/2.jpg");
        }

        ul li:last-child {
            background-image: url("./images/3.jpg");
        }

        ul li::after {
            content: '猜猜我是谁？';
            display: block;
            width: 100%;
            height: 100%;
            background-color: pink;
            transform-origin: 0% 100%;
            transform: rotate(0deg);
            transition: all .3s;
            text-align: center;
            line-height: 292px;
            font-size: 20px;
            color: hotpink;
        }

        ul li:hover::after {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <ul>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</body>
</html>
