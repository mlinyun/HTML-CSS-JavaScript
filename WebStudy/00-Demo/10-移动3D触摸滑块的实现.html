<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-移动3D触摸滑块的实现</title>
    <link rel="stylesheet" href="./css/10-移动3D触摸滑块的实现.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>

<body>
    <div class="carousel">
        <img src="mobile.png" class="mobile">
        <div class="carousel-item">
            <img src="./img/10-img/img1.jpg">
        </div>
        <div class="carousel-item">
            <img src="./img/10-img/img2.jpg">
        </div>
        <div class="carousel-item">
            <img src="./img/10-img/img3.jpg">
        </div>
        <div class="carousel-item">
            <img src="./img/10-img/img4.jpg">
        </div>
        <div class="carousel-item">
            <img src="./img/10-img/img5.jpg">
        </div>
    </div>
    <script src="./js/jquery.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script type="text/javascript">
        $(document).ready(function() {
            $('.carousel').carousel();
        });
    </script>
</body>

</html>
