<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面打印九九乘法表</title>
    <style>
        .box {
            margin: 100px auto;
            width: 1000px;
        }

        .one {
            display: inline-block;
            width: 90px;
            height: 25px;
            margin: 0 10px 10px 0;
            background-color: pink;
            border: 1px solid hotpink;
            text-align: center;
            line-height: 25px;
            color: deeppink;
            border-radius: 5px;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, .2);
        }
    </style>
</head>
<body>
    <div class="box">
        <script>
            for (let i = 1; i <= 9; i++) {
                for (let j = 1; j <= i; j++) {
                    document.write(`
                    <div class="one">${j} × ${i} = ${j * i}</div>
                    `)
                }
                document.write('<br />')
            }
        </script>
    </div>
</body>
</html>
