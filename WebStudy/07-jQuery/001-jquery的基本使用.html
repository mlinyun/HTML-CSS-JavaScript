<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery的基本使用</title>
    <script src="./js/jquery.min.js"></script>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <script>
        // $('div').hide()
        // 1. 等着页面DOM加载完毕再去执行 js 代码
        $(document).ready(function() {
            $('div').hide()
        })
        // 2. 等着页面DOM加载完毕再去执行 js 代码
        $(function() {
            $('div').hide()
        })
        // 两种方法实现的功能是一样的，推荐使用第二种方法
    </script>
    <div></div>
</body>
</html>
