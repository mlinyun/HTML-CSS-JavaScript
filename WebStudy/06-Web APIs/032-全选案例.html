<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全选案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        table {
            width: 300px;
            margin: 100px auto 0;
            border-collapse: collapse;
            border-spacing: 0;
            border: 1px solid #c0c0c0;
        }

        th,
        td {
            border: 1px solid #d0d0d0;
            color: #404060;
            padding: 10px;
        }

        th {
            background-color: #09c;
            font: bold 16px "微软雅黑";
            color: #fff;
        }

        td {
            font: 14px "微软雅黑";
        }

        tbody tr {
            background-color: #f0f0f0;
        }

        tbody tr:hover {
            cursor: pointer;
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th><input type="checkbox" id="j_cbAll"></th>
                <th>商品</th>
                <th>价钱</th>
            </tr>
        </thead>
        <tbody id="j_tb">
            <tr>
                <td><input type="checkbox"></td>
                <td>iPhone8</td>
                <td>8000</td>
            </tr>
            <tr>
                <td><input type="checkbox"></td>
                <td>iPad Pro</td>
                <td>5000</td>
            </tr>
            <tr>
                <td><input type="checkbox"></td>
                <td>iPad Air</td>
                <td>2000</td>
            </tr>
            <tr>
                <td><input type="checkbox"></td>
                <td>Apple Watch</td>
                <td>2000</td>
            </tr>
        </tbody>
    </table>
    <script>
        let j_cbAll = document.getElementById('j_cbAll')    // 全选按钮
        // 下面所有的复选框
        let j_tbs = document.getElementById('j_tb').querySelectorAll('input[type=checkbox]')
        // let flag = 0
        // j_cbAll.addEventListener('click', function() {
        //     if (flag === 0) {
        //         for (let i = 0; i < j_tbs.length; i++) {
        //             j_tbs[i].checked = true
        //         }
        //         flag = 1
        //     } else {
        //         for (let i = 0; i < j_tbs.length; i++) {
        //             j_tbs[i].checked = false
        //         }
        //         flag = 0
        //     }
        // })

        // 全选和取消全选按钮注册
        j_cbAll.addEventListener('click', function() {
            // this.checked 当前复选框的选中状态
            // 值为 true 则为选中，值为 false 则为补选中
            // 让下面所有复选框的checked属性跟随全选按钮即可
            // 即全选按钮选中，下面的复选框就全部选中，全选按钮未选中，则下面的复选框全部不选中
            for (let i = 0; i < j_tbs.length; i++) {
                j_tbs[i].checked = this.checked
            }
        })

        // 下面复选框全部选中，上面的全选才能选中，做法：
        // 给下面所有的复选框绑定点击事件，每次点击，都要循环查看下面的所有的复选框是否有没选中的，
        // 如果有一个没有选中的，上面全选就不选中
        for (let i = 0; i < j_tbs.length; i++) {
            j_tbs[i].addEventListener('click', function() {
                // flag 控制全选按钮是否选中
                let flag = true
                // 每次点击下面的复选框都要循环检查4个按钮是否全部被选中
                for (let j = 0; j < j_tbs.length; j++) {
                    if (!j_tbs[j].checked) {
                        flag = false
                        break   // 只要有一个按钮未被选中即退出循环，提高执行效率
                    }
                }
                j_cbAll.checked = flag
            })
        }
    </script>
</body>
</html>
