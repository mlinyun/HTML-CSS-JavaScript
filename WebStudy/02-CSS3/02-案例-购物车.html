<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-案例-购物车</title>
    <link rel="stylesheet" href="./iconfont/iconfont.css">
    <style>
        ul li {
            list-style: none;
            width: 100px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            /* ps */
            background-color: pink;
        }

        ul li span:nth-child(2) {
            margin-left: 5px;
            margin-right: 5px;
        }

        .icon-cart-Empty-fill {
            font-size: 20px;
            color: red;
        }

    </style>
</head>
<body>
    <ul>
        <li><span class="iconfont icon-cart-Empty-fill"></span><span>购物车</span><span class="iconfont icon-arrow-down"></span></li>
    </ul>
</body>
</html>
