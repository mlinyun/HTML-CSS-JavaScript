<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面输出1~100</title>
</head>
<body>
    <script>
        let i = 1   // 声明变量起始值
        let sum = 0 // 声明累加变量
        let even_sum = 0
        while (i <= 100) {
            document.write(i + '<br />')
            sum += i
            if (i % 2 === 0) {
                even_sum += i
            }
            i++
        }
        document.write(`1 + 2 + 3 + ... + 100 = ${sum} <br />`)
        document.write(`2 + 4 + 6 + ... + 100 = ${even_sum} <br />`)
    </script>
</body>
</html>
