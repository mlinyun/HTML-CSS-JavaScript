<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>do-while循环体验</title>
</head>

<body>
    <script>
        // 1.打印人的一生
        let i = 1
        do {
            console.log(`这个人今年${i}岁了`)
            i++
        } while (i <= 100);

        // 2. 计算1~100之间所用整数的和
        let j = 1
        let sum = 0
        do {
            sum += j
            j++
        } while (j <= 100);
        console.log(sum)

        // 3.弹出一个提示框：你爱我吗？ 如果输入我爱你，就提示我也爱你，程序结束，否则，一直询问
        do {
            // 注意：这里声明变量message时不要使用let,否则会因为作用域而报错
            var message = prompt('你爱我吗？')
        } while (message !== '我爱你');
        alert('我也爱你')

        let message1 = prompt('你爱我吗？')
        while (message1 !== '我爱你') {
            message1 = prompt('你爱我吗？')
        }
        alert('我也爱你')
    </script>
</body>

</html>
