<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和平精英-缩放</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            overflow: hidden;
            width: 249px;
            height: 210px;
            margin: 100px auto;
        }

        li {
            list-style: none;
        }

        img {
            width: 100%;
        }

        .box p {
            color: #3b3b3b;
            padding: 10px 10px 0 10px;
        }

        .box .pic {
            position: relative;
        }

        .box .pic::after {
            position: absolute;
            top: 50%;
            left: 50%;
            content: "";
            width: 58px;
            height: 58px;
            /* 直接使用margin比较简单，代码注释部分为margin做法 */
            /* margin-top: -29px;
            margin-left: -29px; */
            background: url("./images/play.png");
            /* transform: scale(5); */
            /* 使用transform时要注意CSS的层迭性 */
            transform: translate(-50%, -50%) scale(5);
            opacity: 0;	/* 透明度 */
            transition: all .5s;
        }

        .box li:hover .pic::after {
            /* transform: scale(1); */
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li>
                <div class="pic"><img src="./images/party.jpeg" alt=""></div>
                <p>【和平精英】“初火”音乐概念片：四圣觉醒......</p>
            </li>
        </ul>
    </div>
</body>
</html>
