<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0 minimum-scale=1.0">
    <title>京东移动端首页</title>
    <!-- 引入CSS初始化样式文件 -->
    <link rel="stylesheet" href="./css/normalize.css">
    <!-- 引入首页CSS样式文件 -->
    <link rel="stylesheet" href="./css/index.css">
    <!-- 引入 Swiper css文件 -->
    <link rel="stylesheet" href="./css/swiper-bundle.min.css">
    <!-- 引入 Swiper js文件 -->
    <script src="./js/swiper-bundle.min.js"></script>
    <!-- 引入我们自己写的 index.js文件 -->
    <script src="./js/index.js"></script>
</head>
<body>
    <!-- 顶部 -->
    <header class="app">
        <ul>
            <li><img src="./images/close.png" alt=""></li>
            <li><img src="./images/logo.png" alt=""></li>
            <li>打开京东App，购物更轻松</li>
            <li>立即打开</li>
        </ul>
    </header>
    <!-- 搜索 -->
    <div class="search-wrap">
        <div class="search-btn"></div>
        <div class="search">
            <div class="jd-icon"></div>
            <div class="sou"></div>
        </div>
        <div class="search-login">登录</div>
    </div>
    <!-- 主体部分内容 -->
    <div class="main-content">
        <!-- 滑动图 -->
        <div class="slider">
            <!-- 复制 Swiper html结构代码 -->
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="./upload/001.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/002.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/003.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/004.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/005.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/006.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/007.jpg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./upload/008.png" alt="">
                    </div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
                <div class="swiper-pagination"></div>
            </div>
        </div>
        <!-- 导航图 -->
        <nav>
            <ul>
                <li><a href="#"><img src="./images/1001.png" alt=""><span>京东超市</span></a></li>
                <li><a href="#"><img src="./images/1002.png" alt=""><span>数码电器</span></a></li>
                <li><a href="#"><img src="./images/1003.png" alt=""><span>衣服服饰</span></a></li>
                <li><a href="#"><img src="./images/1004.png" alt=""><span>京东生鲜</span></a></li>
                <li><a href="#"><img src="./images/1005.png" alt=""><span>京东到家</span></a></li>
                <li><a href="#"><img src="./images/1006.png" alt=""><span>充值缴费</span></a></li>
                <li><a href="#"><img src="./images/1007.png" alt=""><span>附近好店</span></a></li>
                <li><a href="#"><img src="./images/1008.png" alt=""><span>领券</span></a></li>
                <li><a href="#"><img src="./images/1009.png" alt=""><span>零金贴</span></a></li>
                <li><a href="#"><img src="./images/1010.png" alt=""><span>PLUS会员</span></a></li>
            </ul>
        </nav>
    </div>
    <!-- 底部 -->
    <footer>
        <ul>
            <li><a href="#"><img src="./images/footer01.png" alt=""></a></li>
            <li><a href="#"><img src="./images/footer02.png" alt=""></a></li>
            <li><a href="#"><img src="./images/footer03.png" alt=""></a></li>
            <li><a href="#"><img src="./images/footer04.png" alt=""></a></li>
            <li><a href="#"><img src="./images/footer05.png" alt=""></a></li>
        </ul>
    </footer>
</body>
</html>
