<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取特殊元素(body、html)</title>
</head>
<body>
    <script>
        // 获取body元素
        let bodyEle = document.body
        console.log(bodyEle)        // 返回body元素对象

        // 获取html元素
        let htmlEle = document.documentElement
        console.log(htmlEle)        // 返回html元素对象
    </script>
</body>
</html>
