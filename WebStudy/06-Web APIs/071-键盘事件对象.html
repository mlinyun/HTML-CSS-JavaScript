<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>键盘事件对象</title>
</head>
<body>
    <script>
        // 键盘事件对象中的keyCode属性可以得到相应键的ASII码值
        // 1. keyup 和 keydown 事件不区分字母大小写 a 和 A 得到的值都是 65
        // 2. keypress 事件 区分大小写 a 得到的值都是 97 和 A 得到的值都是 65
        document.addEventListener('keyup', function(e) {
            console.log('up:' + e.keyCode);
            // 我们可以利用keyCode返回的ASII码值来判断用户按下了那个键
            if (e.keyCode === 48) {
                alert('您按下了0键')
            } else {
                alert('您没有按下0键')
            }
        })

        document.addEventListener('keypress', function(e) {
            console.log('press' + e.keyCode);
        })
    </script>
</body>
</html>
