<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>立方体</title>

	    <style>
	        /*  要求：
	        1.根据第一张效果图，设计出一个正方体。
	        2.完成1后，更改perspective属性的值调整视距，得到第二张效果图。
	        3.完成前面步骤后，分别设置perspective-origin属性值左上、右上，调整视线灭点，得到第三、四张效果图。
	         */
			@keyframes my1 {
				0% {
					transform: rotateY(0deg);
				}

				100% {
					transform: rotateY(360deg);
				}
			}
			
	        .box{
	            width: 300px;
	            height:300px;
	            margin:300px auto;
	            perspective: 500px;
				/* perspective-origin: right top; */
			
	        }
	        .con{
	            position:relative;
	            width:300px;
	            height:300px;
	            transform-style:preserve-3d;
				transform-origin: center center -180px;
				transform: rotateY(-45deg);
				animation: my1 5s linear 1s  infinite alternate;		
	        }
	         .side{
	            position:absolute;
	            width:300px;
	            height:300px;
	            font-size:44px;
	            line-height: 300px;
				background-color: #90EE90;
	            text-align: center;
	        }

			.before {
				background-color: rgba(255, 0, 0, .3);
			}

			.left {
				background-color: rgba(255, 255, 20, .3);
				left: -300px;
				transform-origin: right;
				transform: rotateY(-90deg);
			}

			.right {
				background-color: rgba(255, 0, 255, .3);
				left: 300px;
				transform-origin: left;
				transform: rotateY(90deg);
			}

			.top {
				background-color: rgba(55, 0, 25, .3);
				transform-origin: top;
				transform: rotateX(-90deg);
			}

			.bottom {
				background-color: rgba(255, 100, 255, .3);
				transform-origin: bottom;
				transform: rotateX(90deg);
			}

			.back {
				background-color: rgba(25, 50, 255, .3);
				transform: translateZ(-300px);
			}
	    </style>
	</head>
	<!--
	CSS3 的 3D 变形属性
		transform	向元素应用 2D 或 3D 转换。
		transform-origin	允许改变被转换元素的位置。	
		transform-style	规定被嵌套元素如何在 3D 空间中显示。	
		perspective	规定 3D 元素的透视效果。	
		perspective-origin	规定 3D 元素的底部位置。	
		backface-visibility	定义元素在不面对屏幕时是否可见。
	transform 增加了变形函数：
			rotateX：表示元素沿着 x 轴旋转。
			rotateY：表示元素沿着 y 轴旋转。
			rotateZ：表示元素沿着 z 轴旋转。
			rotate3d(x,y,z,angle),x,y,z分别为三个坐标轴上的矢量0-1，angle为角度。
	transform-style
			用来设置嵌套的子元素在 3D 空间中显示效果。
			它可以设置两个属性值，flat（子元素不保留其 3D 位置，
			默认值）和 preserve-3d（子元 素保留它的 3D 位置）。
	perspective
			设置成透视效果，透视效果为近大远小。
			该属性值用来设置 3D 元素距离视图的距离，单位为像素，
			已经内置了，我们只需要写具体数值即可，默认值为 0。
			当为元素定义 perspective 属性时，其子元素会获得透视效果，而不是元素本身。
	perspective-origin
			设置 3D 元素所基于的 x 轴和 y 轴，改变 3D 元素的底部位置，
			该属性取值同transform-origin，默认值为 50% 50%。
	 -->
	<body>
	<div class="box">
	    <div class="con">
	       <div class="side before">前</div>
	        <div class="side back">后</div>
	        <div class="side top">上</div>
	        <div class="side bottom">下</div>
	        <div class="side left">左</div>
	        <div class="side right">右</div>
	    </div>
	</div>
	</body>
</html>
