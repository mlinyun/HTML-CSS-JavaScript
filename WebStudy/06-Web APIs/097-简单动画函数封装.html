<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单动画函数封装</title>
    <style>
        div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            background-color: pink;
        }

        span {
            position: absolute;
            top: 120px;
            left: 0;
            display: block;
            width: 200px;
            height: 200px;
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div></div>
    <span></span>
    <script>
        // 简单动画函数封装 obj 目标对象 target目标位置
        function animate(obj, target) {
            let timer = setInterval(move, 10)
            function move() {
                // 停止动画 本质是停止计时器
                if (obj.offsetLeft >= target) {
                    clearInterval(timer)
                }
                obj.style.left = obj.offsetLeft + 1 + 'px'
            }
        }

        // 获取元素
        let div = document.querySelector('div')
        let span = document.querySelector('span')
        // 调用函数
        animate(div, 400)
        animate(span, 300)
    </script>
</body>
</html>
