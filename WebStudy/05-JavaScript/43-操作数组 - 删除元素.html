<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作数组 - 删除元素</title>
</head>
<body>
    <script>
        // 方法①：数组.pop() 方法从数据中删除最后一个元素，并返回该元素的值，语法：
        // let arr = ['red', 'green', 'blue']
        // let Delete = arr.pop()
        // console.log(arr)	// ['red', 'green']
        // console.log(Delete)	// blue
        // 注意
        // (1) pop() 可以删除数组最后一个元素，记住一次只能删除一个元素
        // (2) pop() 没有参数
        // (3) pop() 完毕后，返回的值是删除的那个元素的值
        // (4) pop() 会修改原数组，即原数组会发生改变

        // 方法②：数组.shitf() 方法从数据中删除第一个元素，并返回该元素的值，语法：
        // let arr = ['red', 'green', 'blue']
        // let Delete = arr.shift()
        // console.log(arr)	// ['green', 'blue']
        // console.log(Delete)	// red
        // 注意
        // (1) shift() 可以删除数组开头第一个元素，记住一次只能删除一个元素
        // (2) shift() 没有参数
        // (3) shift() 完毕后，返回的值是删除的那个元素的值
        // (4) shift() 会修改原数组，即原数组会发生改变

        // 方法③：数组.splice(删除内容) 方法 删除指定元素，语法：
        // let arr = ['red', 'green', 'blue']
        // arr.splice(1, 1)	// 从数组里的第2个元素开始删除，删除1个
        // console.log(arr)	// ['red', 'blue']
    </script>
