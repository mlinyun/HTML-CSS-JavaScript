<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>012-淘宝精品服饰展示案例</title>
    <style>
        /* 初始化样式 */
        * {
            margin: 0;
            padding: 0;
            font-size: 12px;
        }

        ul {
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        /* 容器 */
        .wrapper {
            width: 250px;
            height: 248px;
            margin: 100px auto 0;
            border: 1px solid pink;
            border-right: none;
            overflow: hidden;
        }

        #left,
        #content {
            float: left;
        }

        #left li {
            background: url('./images/lili.jpg') repeat-x;
        }

        #left li a {
            display: block;
            width: 48px;
            height: 27px;
            border-bottom: 1px solid pink;
            line-height: 27px;
            text-align: center;
            color: black;
        }

        #left li a:hover {
            background-image: url("images/abg.gif");
        }

        #content {
            border-left: 1px solid pink;
            border-right: 1px solid pink;
        }
    </style>
    <script src="./js/jquery.min.js"></script>
    <script>
        $(function() {
            // 1. 鼠标经过左侧的小li
            $('#left li').mouseover(function() {
                // 2. 得到当前小li的索引号index    $(this).index()
                let index = $(this).index()
                // 排他思想 干掉所有人 复活自己
                // 3. 让我们右侧的盒子相应索引号的图片显示出来即可
                $('#content div').eq(index).show()
                // 4. 让其余的图片（就是其他的兄弟隐藏起来）
                $('#content div').eq(index).siblings('div').hide()
                // 链式编程
                $('#content div').eq(index).show().siblings('div').hide()
            })
        }) 
    </script>
</head>
<body>
    <div class="wrapper">
        <ul id="left">
            <li><a href="#">女靴</a></li>
            <li><a href="#">雪地靴</a></li>
            <li><a href="#">冬裙</a></li>
            <li><a href="#">呢大衣</a></li>
            <li><a href="#">毛衣</a></li>
            <li><a href="#">棉服</a></li>
            <li><a href="#">女裤</a></li>
            <li><a href="#">羽绒服</a></li>
            <li><a href="#">牛仔裤</a></li>
        </ul>
        <div id="content">
            <div>
                <a href=""><img src="./images/女靴.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/雪地靴.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/冬裙.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/呢大衣.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/毛衣.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/棉服.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/女裤.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/羽绒服.jpg" alt=""></a>
            </div>
            <div>
                <a href=""><img src="./images/牛仔裤.jpg" alt=""></a>
            </div>
        </div>
    </div>
</body>
</html>
