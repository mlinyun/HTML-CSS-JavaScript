<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期对象</title>
</head>
<body>
    <script>
        let now = new Date()
        console.log(now)    // 打印系统当前时间

        let date1 = new Date(2022, 08, 20, 15, 03, 59)
        console.log(date1)  // Tue Sep 20 2022 15:03:59 GMT+0800 (中国标准时间)

        let date2 = new Date('2022/08/20 15:05:40')
        // 这里返回的不是8月，而是9月
        console.log(date2)  // Sat Aug 20 2022 15:05:40 GMT+0800 (中国标准时间)

        let date3 = new Date('2022-08-20 15:07:30')
        console.log(date3)  // Sat Aug 20 2022 15:07:30 GMT+0800 (中国标准时间)
    </script>
</body>
</html>
