<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>103-jQuery对象和DOM对象</title>
    <script src="./js/jquery.min.js"></script>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="div1"></div>
    <div class="div2"></div>
    <span></span>
    <script>
        // 1. DOM 对象：用原生JS获取过来的对象就是DOM对象
        let myDiv = document.querySelector('.div1')
        let mySpan = document.querySelector
        console.dir(myDiv)

        // 2. jQuery 对象：用jQuery方式获取过来的对象就是jQuery对象。本质：通过$把DOM元素进行了包装
        console.dir($('.div2'))   // $('.div2') 就是一个jQuery对象
        console.dir($('span'))  // $('span') 也是一个jQuery对象
        // 3. jQuery 对象只能使用 jQuery 方法，DOM 对象则使用原生的 JavaScript 属性和方法
        // 原生 JavaScript 实现隐藏div
        // myDiv.hide() myDiv是一个DOM对象不能使用 jQuery里面的hide方法
        myDiv.style.display = 'none'

        // jQuery 实现隐藏div
        // $('.div2').style.display = 'none' $('.div2')是一个jQuery对象，不能使用原生js的属性和方法
        $('.div2').hide()
    </script>
</body>
</html>
