<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件监听</title>
</head>
<body>
    <button>点击一下</button>
    <script>
        // 1. 获取元素
        let btn = document.querySelector('button')
        // 2. 事件监听 （事件注册或绑定事件)
        btn.addEventListener('click', function() {
            alert('被点击了')
        })
    </script>
</body>
</html>
