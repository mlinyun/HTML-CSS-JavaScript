<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>媒体查询引入资源</title>
    <style>
        /* 当我们屏幕大于等于640px,我们让div 一行显示2个 */
        /* 当屏幕小于640px时，我们让div一行显示一个 */
        /* 一个建议：媒体查询建议按照从小到大的方式来写 */
        /* 代码是从上往下执行的，所以媒体查询建议使用从小到大的写法 */
    </style>
    <!-- 引入资源 -->
    <link rel="stylesheet" href="./css/styleA.css" media="screen and (min-width: 320px)">
    <link rel="stylesheet" href="./css/styleB.css" media="screen and (min-width: 640px)">
    <!-- 引入资源的作用：针对不同的屏幕尺寸，调用不同的css样式文件 -->
</head>
<body>
    <div>1</div>
    <div>2</div>
</body>
</html>
