<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东放大镜效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            margin: 100px 0 0 100px;
        }

        .preview_img {
            position: relative;
            width: 398px;
            height: 398px;
            border: 1px solid #ccc;
        }

        .mask {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 300px;
            background-color: #FEDE4F;
            opacity: .5;
            border: 1px solid #ccc;
            cursor: move;
        }

        .big {
            display: none;
            position: absolute;
            top: 0;
            right: -510px;
            width: 500px;
            height: 500px;
            /* background-color: pink; */
            z-index: 9999;
            border: 1px solid #ccc;
            overflow: hidden;
        }

        .big img {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="preview_img">
            <img src="./images/s3.png" alt="">
            <div class="mask"></div>
            <div class="big">
                <img src="./images/big.jpg" alt="" class="bigImg">
            </div>
        </div>
    </div>
    <script>
        // 1. 获取需要操作的元素
        let preview_img = document.querySelector('.preview_img')
        let mask = document.querySelector('.mask')
        let big = document.querySelector('.big')

        // 2. 当我们鼠标经过 preview_img 就显示 mask 遮挡层 和 big 大盒子
        preview_img.addEventListener('mouseover', function() {
            mask.style.display = 'block'
            big.style.display = 'block'
        })

        // 3. 当我们鼠标离开 preview_img 就隐藏 mask 遮挡层 和 big 大盒子
        preview_img.addEventListener('mouseout', function() {
            mask.style.display = 'none'
            big.style.display = 'none'
        })

        // 4. 鼠标移动的时候，让黄色的盒子跟着鼠标走
        preview_img.addEventListener('mousemove', function(e) {
            // 4.1 先计算出鼠标在盒子内的坐标
            let x = e.pageX - this.offsetLeft
            let y = e.pageY - this.offsetTop

            // 4.2 减去盒子高度300 的一半 是 150 就是我们 mask 最终的 left 和 top
            // 4.3 我们 mask 移动的距离
            let maskX = x - mask.offsetWidth / 2
            let maskY = y - mask.offsetHeight / 2
            // 4.4 如果 x 坐标小于 0，就让它停在 0 的位置
            // 遮挡层的最大移动距离
            let maskMax = preview_img.offsetWidth - mask.offsetWidth
            if (maskX <= 0) {
                maskX = 0
            } else if (maskX >= maskMax) {
                maskX = maskMax
            }
            if (maskY <= 0) {
                maskY = 0
            } else if (maskY >= maskMax) {
                maskY = maskMax
            }
            mask.style.left = maskX + 'px'
            mask.style.top = maskY + 'px'

            // 5. 大图片的移动距离 = 遮挡层移动距离 * 大图片最大移动距离 / 遮挡层的最大移动距离
            // 获取大图元素
            let bigImg = document.querySelector('.bigImg')
            // 大图片最大移动距离
            let bigMax = bigImg.offsetWidth - big.offsetWidth
            // 大图片的移动距离 X Y
            let bigX = maskX * bigMax / maskMax
            let bigY = maskY * bigMax / maskMax
            bigImg.style.left = -bigX + 'px'
            bigImg.style.top = -bigY + 'px'
        })
    </script>
</body>
</html>
