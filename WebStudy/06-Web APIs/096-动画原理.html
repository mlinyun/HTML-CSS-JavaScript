<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画原理</title>
    <style>
        div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div></div>
    <script>
        // 动画原理
        // 1. 获取盒子当前的位置 div.offsetLeft
        // 2. 让盒子在当前位置上加1个移动距离
        // 3. 利用定时器不断重复这个操作
        // 4. 加一个结束定时器的条件
        // 5. 注意此元素需要添加定位，才可以使用 element.style.left

        // 获取元素
        let div = document.querySelector('div')
        // 设置定时器
        let timer = setInterval(move, 10)
        function move() {
            // 停止动画 本质是停止计时器
            if (div.offsetLeft >= 400) {
                clearInterval(timer)
            }
            div.style.left = div.offsetLeft + 1 + 'px'
        }
    </script>
</body>
</html>
