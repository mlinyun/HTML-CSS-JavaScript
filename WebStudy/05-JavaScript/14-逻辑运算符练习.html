<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逻辑运算符练习</title>
</head>
<body>
    <script>
        // 布尔值参与的逻辑运算
        let num = 7
        let str = '我爱你~中国~'
        console.log(num > 5 && str.length >= num)

        console.log(num < 5 && str.length >= num)

        console.log(!(num < 10))

        console.log(!(num < 10 || str.length == num))
    </script>
</body>
</html>
