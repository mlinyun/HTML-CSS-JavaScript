<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>87-Bootstrap实现一款简洁时尚的价格表效果</title>
    <link rel="stylesheet" href="./js/jquery.min.js">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap-theme.min.css">
    <link rel="stylesheet" href="./css/87-Bootstrap实现一款简洁时尚的价格表效果.css">
</head>

<body>
    <div class="demo">
        <div class="container">
            <div class="row">
                <div class="col-md-4 col-sm-6">
                    <div class="pricingTable">
                        <h3 class="title">月度</h3>
                        <div class="price-value">
                            <span class="month">30天</span>
                            <span class="amount">
                    <span class="currency">￥ </span> 39
                            <span class="value">99</span>
                            </span>
                        </div>
                        <ul class="pricing-content">
                            <li>logo设计</li>
                            <li>icon设计</li>
                            <li>banner设计</li>
                            <li>DM设计</li>
                            <li>名片设计</li>
                            <li>以上设计均可</li>
                        </ul>
                        <a href="javascript:;" class="pricingTable-signup" target="_blank">立即订阅</a>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6">
                    <div class="pricingTable">
                        <h3 class="title">季度</h3>
                        <div class="price-value">
                            <span class="month">90天</span>
                            <span class="amount">
                    <span class="currency">￥ </span> 99
                            <span class="value">99</span>
                            </span>
                        </div>
                        <ul class="pricing-content">
                            <li>logo设计</li>
                            <li>icon设计</li>
                            <li>banner设计</li>
                            <li>DM设计</li>
                            <li>名片设计</li>
                            <li>以上设计均可</li>
                        </ul>
                        <a href="javascript:;" class="pricingTable-signup" target="_blank">立即订阅</a>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6">
                    <div class="pricingTable">
                        <h3 class="title">年度</h3>
                        <div class="price-value">
                            <span class="month">365天</span>
                            <span class="amount">
                    <span class="currency">￥ </span> 999
                            <span class="value">99</span>
                            </span>
                        </div>
                        <ul class="pricing-content">
                            <li>logo设计</li>
                            <li>icon设计</li>
                            <li>banner设计</li>
                            <li>DM设计</li>
                            <li>名片设计</li>
                            <li>以上设计均可</li>
                        </ul>
                        <a href="javascript:;" class="pricingTable-signup" target="_blank">立即订阅</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
