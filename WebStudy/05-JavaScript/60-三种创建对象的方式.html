<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三种创建对象的方式</title>
</head>
<body>
    <script>
        // 使用字面量创建 goods 对象
        let goods = {
            bran: '小米(MI)',
            name: '小米10青春版',
            num: '100012816024',
            wieght: '0.55kg',
            address: '中国大陆'
        }

        // 使用关键字 new Object() 创建 obj 对象
        let obj = new Object()
        obj.uname = '张三疯'
        obj.age = 18
        obj.gender = '男'
        obj.sayHi = function() {
            console.log('hi~~')
        }
        console.log(obj)
        console.log(obj.uname)
        console.log(obj['age'])
        obj.sayHi()
    </script>
</body>
</html>
