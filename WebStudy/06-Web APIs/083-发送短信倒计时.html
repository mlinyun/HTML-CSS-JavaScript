<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发送短信倒计时</title>
</head>
<body>
    手机号码：
    <input type="number">
    <button>发送</button>
    <script>
        let btn = document.querySelector('button')
        // 全局变量，定义剩下的秒数
        let time = 60
        // 注册单击事件
        btn.addEventListener('click', function() {
            // 禁用按钮
            btn.disabled = true
            // 开启定时器
            let timer = setInterval(function() {
                console.log(this);
                // 判断剩余秒数
                if (time === 0) {
                    // 清除定时器和复原按钮
                    clearInterval(timer)
                    // 这里的btn不能写出this，这里的this指向window
                    btn.disabled = false
                    btn.innerHTML = '发送'
                    time = 60   // 这个60需要重新开始
                } else {
                    btn.innerHTML = `还剩下${time}秒`
                    time--
                }
            }, 1000)
        })
    </script>
</body>
</html>
