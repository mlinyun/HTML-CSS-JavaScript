<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态生成表格案例</title>
    <style>
        a {
            text-decoration: none;
        }

        table {
            width: 500px;
            margin: 100px auto 0;
            border-collapse: collapse;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #333;
        }

        thead tr {
            height: 40px;
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <table cellspacing="0">
        <thead>
            <tr>
                <th>姓名</th>
                <th>科目</th>
                <th>成绩</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        let datas = [{
            name: '魏璎珞',
            subject: 'JavaScript',
            score: 100
        }, {
            name: '弘历',
            subject: 'JavaScript',
            score: 98
        }, {
            name: '傅恒',
            subject: 'JavaScript',
            score: 88
        }, {
            name: '明玉',
            subject: 'JavaScript',
            score: 99
        }, {
            name: '大猪蹄子',
            subject: 'JavaScript',
            score: 0
        }]
        // 往 tbody 里创建行，有几个人我们就创建几行
        // 可以通过数组的长度得知有几个人
        let tbody = document.querySelector('tbody')
        for (let i =0; i < datas.length; i++) {
            // 1. 创建 tr 行
            let tr = document.createElement('tr')
            tbody.appendChild(tr)
            // 2. 行里面创建单元格 td  单元格的数量取决于每个对象里面的属性个数
            // 使用for循环遍历对象
            for (let k in datas[i]) {
                // 创建单元格
                let td = document.createElement('td')
                // 把对象里面的属性值给单元格
                // k 得到的是属性名 datas[i][k]得到的是属性值
                td.innerHTML = datas[i][k]
                tr.appendChild(td)
            }
            
            // 3. 创建有删除2字得单元格
            let td = document.createElement('td')
            td.innerHTML = '<a href="javascript:;">删除</a>'
            tr.appendChild(td)
        }

        // 4.获取所有得 a 元素
        let as = document.querySelectorAll('a')
        // 遍历循环注册事件
        for (let i = 0; i < as.length; i++) {
            as[i].addEventListener('click', function() {
                // 点击 a 删除当前 a 所在的行 即 a 的爸爸的爸爸
                tbody.removeChild(this.parentElement.parentElement)
            })
        }
    </script>
</body>
</html>
