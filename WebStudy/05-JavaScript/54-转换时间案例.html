<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转换时间案例</title>
</head>
<body>
    <script>
        // 需求：用户输入秒数，可自动转化为秒数
        let seconds = +prompt('请输入总的秒数：')
        function getTimes(t) {
            let h = parseInt(seconds / 60 / 60 % 24)
            let m = parseInt(seconds / 60 % 60)
            let s = parseInt(seconds % 60)
            h = h >= 10 ? h : '0' + h
            m = m >= 10 ? m : '0' + m
            s = s >= 10 ? s : '0' + s
            return `计算之后的时间是：${h}时${m}分钟${s}秒`
        }
        let str = getTimes(seconds)
        alert(str)
    </script>
</body>
</html>
