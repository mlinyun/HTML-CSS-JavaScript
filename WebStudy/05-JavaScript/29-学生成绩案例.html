        let stu_num = +prompt('请输入班级的总人数：')
        let total_score = 0
        let average = 0
        for (let i = 1; i <= stu_num; i++) {
            let stu_score = +prompt(`请输入第${i}个学生的成绩`)
            total_score += stu_score
        }
        average = total_score / stu_num
        alert(`该班的总成绩是${total_score}，平均成绩是${average}`)
    </script>
