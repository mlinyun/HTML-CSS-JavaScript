<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>美术网</title>
<style>
    .main{
        width:590px;
        height:200px;
        border:1px solid #D1C9BC;
    }
    .top{
        position: relative;
        width:100%;
        height:190px;
        background-color:#C9B98E;
        padding-top:10px;
    }
    .title{
       width: 500px;
       line-height: 50px;
       background-color: #fff;
       border-radius: 10px;
       position: absolute;
       top: 0;
       left: 50%;
       transform: translate(-50%, -50%);
    }
    
</style>
</head>
<body>
<div class="main">
    <div class="top">
        <div class="title">
            <b style="margin:0 40px">美术网</b><span style="color:gray">首页 | 新闻 | 艺术品 | 拍卖 | 创意商店 | 云推荐</span>
        </div>
    </div>
   
</div>
</body>
</html>
