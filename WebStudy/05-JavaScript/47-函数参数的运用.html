        // 3.用户输入任意两个数，输出两个数中最大的数
        let num1 = +prompt('请输入第一个数: ')
        let num2 = +prompt('请输入第二个数: ')
        function getMax(x, y) {
            // 当调用者没有传入数据时，x,y默认为0
            // 利用逻辑中断可以实现这一个功能
            x = x || 0
            y = y || 0
            if (x > y) {
                return x
            } else {
                return y
            }
        }
        let max = getMax(num1, num2)
        alert(`${num1}和${num2}中最大的数是${max}`)
