<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title></title>
		<script>
			//1统计一个字符串中a出现的次数
			//2统计一个字符串中第一个字符出现的次数
			//3统计一个字符串中每个字符出现的次数
			//4统计一个字符串中出现次数最多的字符
			var str = "gngdfagwrafsagfcdaisg"
			console.log(str.match(/a/g).length)
			var count = 0;
			for (i in str) {
				if (str[i] == str[0]) {
					count++;
				}
			}
			console.log(count)
			var obj ={}
			for (i = 0; i<str.length;i++) {
				key = str[i]
				if (obj[key]) {
					obj[key]++
				} else {
					obj[key] = 1
				}
			}
			for (var key in obj) {
				console.log(key+"出现的次数:",obj[key])
			}
			var max = 0
			var maxString=""
			for (var key in obj) {
				if (max<obj[key]) {
					max = obj[key]
					maxString = key
				}
			}
			console.log("出现次数最多的字符:"+maxString)
		</script>

	</body>
