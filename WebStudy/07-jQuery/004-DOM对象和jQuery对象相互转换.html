<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>004-DOM对象和jQuery对象相互转换</title>
    <script src="./js/jquery.min.js"></script>
</head>
<body>
    <video src="./video/mov.mp4" muted></video>
    <script>
        // 1. DOM对象转换为jQuery对象
        // (1) 我们直接获取视频，得到的就是jQuery对象
        $('video')
        // (2) 我们已经使用原生 js 获取过来的DOM对象
        let myVideo = document.querySelector('video')
        // $(myVideo).play() jQuery里面没有play() 这个方法
        // 2. jQuery对象转换为DOM对象
        // myVideo.play()
        $('video')[0].play()
        $('video').get(0).play()
    </script>
</body>
</html>
