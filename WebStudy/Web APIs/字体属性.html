<!DOCTYPE html>
<!-- 按要求设置字体属性（css中文字体对应的英文名见文档末尾。）
（1）内部样式：
     设置段落的字体为YouYuan,fangsong,"楷体";字号x-large
（2）内联样式：
     根据括号要求的效果，分别设置span的字体属性。
-->
<html>
	<head>
		<meta charset="utf-8">
		<title>字体属性</title>
	</head>	
	<style type="text/css">
		p {
			font-size: x-large;
			font-family: YouYuan,fangsong,"楷体";
		}
	</style>
	<body>
		<h1>临江仙</h1>
		<p>
			<span style="font-family: LiSu; font-size: 30px;">(隶书，30px)滚滚长江东逝水，</span><br>
			<span style="font-style: italic; font-size: larger;">(斜体，字号较大)浪花淘尽英雄。</span><br>
			<span style="font-weight: 400;">（细）是非成败转头空。</span><br>
			<span style="font-weight: 700;">（粗）青山依旧在，</span><br>
			<span style="font-size: smaller;">（字号较小）几度夕阳红。</span><br>
			<span style="font-style: italic;">（倾斜）白发渔樵江渚上，</span><br>
			<span style="font-variant: small-caps;">（小型大写字体）aaa惯看秋月春风。</span><br>
			<span style="font-size: 20%;">（字号20%）一壶浊酒喜相逢。</span><br>
			<span style="font-weight: 100;">(粗细值是100)古今多少事，</span><br>
			<span style="font: italic bold 40px KaiTi;">(font属性设置斜体，楷体，更粗、40px)都付笑谈中。</span><br>
		</p>
	</body>
</html>
